/* ===== MAIN: version switching, scaling, hash routing ===== */
function switchTo(id,first){if(!V[id])id='xp';cur=id;localStorage.setItem('wtm-ver',id);history.replaceState(null,'','#'+id);$('#sel').value=id;stepOk=false;
 const v=V[id],ov=el('div','',id=='dos'?'Booting MS-DOS...\nMemory test OK\nStarting MS-DOS...':v.boot);ov.id='ov';
 if(id!='dos'&&id!='win1'&&id!='win95'&&id!='xp')ov.style.cssText='background:#123;font:30px system-ui;color:#fff';
 buildStage();$('#stage').append(ov);setTimeout(()=>ov.classList.add('go'),first?500:400);setTimeout(()=>ov.remove(),1000);
 $('#info').innerHTML='<h2>'+v.n+' <span>('+v.y+')</span></h2>'+v.l+'<br><span>Key features:</span> '+v.f.join(' · ')+'<br><span>Fun fact:</span> '+v.x;tutRender()}
function fit(){const w=$('#wrap'),fs=document.fullscreenElement,W=fs?innerWidth:w.clientWidth,H=fs?innerHeight:w.clientHeight;k=Math.min(W/1280,H/720);
 $('#stage').style.transform='scale('+k+')';$('#fit').style.width=1280*k+'px';$('#fit').style.height=720*k+'px'}
ORDER.forEach(id=>{const o=el('option','',V[id].n+' ('+V[id].y+')');o.value=id;$('#sel').append(o)});
try{tut=JSON.parse(localStorage.getItem('wtm-tut')||'{}')}catch(e){}
resetFS();
$('#sel').onchange=e=>switchTo(e.target.value);
$('#bt').onclick=()=>openTut();
$('#br').onclick=()=>{resetFS();tut[cur]=0;save();$('#stage').classList.remove('dark');switchTo(cur)};
$('#bf').onclick=()=>$('#fit').requestFullscreen&&$('#fit').requestFullscreen();
addEventListener('resize',fit);document.addEventListener('fullscreenchange',fit);
addEventListener('keydown',e=>{if(e.key=='Escape'){const s=$('#start');s&&s.classList.remove('open');openTut(false)}
 if(e.key=='Meta'&&$('#sb'))$('#sb').click();if(e.altKey&&e.key=='F4'&&wins.length){e.preventDefault();wins[wins.length-1].close()}});
fit();switchTo(location.hash.slice(1)||localStorage.getItem('wtm-ver')||'xp',true);
</script></body></html>
